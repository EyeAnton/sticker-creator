<!doctype html><meta charset="utf-8"><title>mock sticker</title>
<!-- Рисует заглушку стикера (зелёный фон, белая обводка, тёмно-зелёная тень) → assets/mock.png.
     Запуск: Chrome --headless --dump-dom tools/make_mock.html, base64 из <pre id=out>. -->
<canvas id="c" width="1024" height="1024"></canvas><pre id="out"></pre>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
x.fillStyle = '#00FF00'; x.fillRect(0, 0, 1024, 1024);
// тёмно-зелёная тень под стикером
x.fillStyle = 'rgba(0,70,0,.55)'; x.filter = 'blur(14px)';
x.beginPath(); x.ellipse(528, 560, 380, 380, 0, 0, 7); x.fill(); x.filter = 'none';
// белая обводка
x.fillStyle = '#fff'; x.beginPath(); x.arc(512, 512, 372, 0, 7); x.fill();
// «лицо»-смайл
x.fillStyle = '#ffcf5c'; x.beginPath(); x.arc(512, 512, 340, 0, 7); x.fill();
x.fillStyle = '#2b1b0e';
for (const ex of [390, 634]) { x.beginPath(); x.ellipse(ex, 440, 34, 52, 0, 0, 7); x.fill(); }
x.lineWidth = 26; x.lineCap = 'round'; x.strokeStyle = '#2b1b0e';
x.beginPath(); x.arc(512, 560, 150, 0.2 * Math.PI, 0.8 * Math.PI); x.stroke();
x.fillStyle = 'rgba(255,90,90,.55)';
for (const bx of [330, 694]) { x.beginPath(); x.ellipse(bx, 580, 50, 32, 0, 0, 7); x.fill(); }
document.getElementById('out').textContent = c.toDataURL('image/png').split(',')[1];
</script>
