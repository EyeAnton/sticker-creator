name = "sticker-creator"
main = "src/index.js"
compatibility_date = "2026-09-01"

# KV для задач, счётчиков лимитов и отклонённых фото.
# Создать: npx wrangler kv namespace create JOBS → вписать id сюда.
[[kv_namespaces]]
binding = "JOBS"
id = "fb4a46da3ba54c14b4732ed69e9819b4"

[vars]
PROVIDER_MODE = "live"
RH_API_BASE_URL = "https://www.runninghub.ai/openapi/v2"
# Endpoint'ы RunningHub Standard Model API (канал «低价渠道版»); канал меняется одной строкой
RH_VALIDATE = "rhart-text-g-3-pro-preview/image-to-text"
RH_RESTYLE = "rhart-image-n-pro/edit"
RH_EMOTION_FAST = "rhart-image-n-g31-flash/image-to-image"
RH_EMOTION_PRO = "rhart-image-n-pro/edit"
RH_QA = "rhart-text-g-3-pro-preview/image-to-text"
RH_RESOLUTION = "1k"
# Хосты результатов RunningHub (кроме runninghub.ai/.cn): точное имя бакета COS из реального ответа; шаблон *.myqcloud.com нельзя — это открытый прокси
RH_IMG_HOSTS = "rh-hk-images-1252422369.cos.ap-hongkong.myqcloud.com"
ALLOWED_ORIGINS = "https://eyeanton.github.io,http://localhost:8000"
MAX_EMOTIONS = "10"
PER_IP_DAY = "1"
GLOBAL_DAY = "10"
RUNS_DAY = "200"
TURNSTILE_SITE_KEY = "0x4AAAAAAFeAR4ZK98XyO54z"

# Секреты (не здесь!): npx wrangler secret put RUNNINGHUB_API_KEY | TURNSTILE_SECRET | IP_SALT
