name = "sticker-creator"
main = "src/index.js"
compatibility_date = "2026-09-01"

# KV для задач, счётчиков лимитов и отклонённых фото.
# Создать: npx wrangler kv namespace create JOBS → вписать id сюда.
[[kv_namespaces]]
binding = "JOBS"
id = "REPLACE_WITH_KV_ID"

[vars]
PROVIDER_MODE = "stub"
RH_API_BASE_URL = "https://www.runninghub.ai/openapi/v2"
# Endpoint'ы RunningHub Standard Model API (канал «低价渠道版»); канал меняется одной строкой
RH_VALIDATE = "rhart-text-g-25-pro/image-to-text"
RH_RESTYLE = "rhart-image-n-pro/edit"
RH_EMOTION_FAST = "rhart-image-n-g31-flash/image-to-image"
RH_EMOTION_PRO = "rhart-image-n-pro/edit"
RH_QA = "rhart-text-qwen-27b/chat"
RH_RESOLUTION = "1k"
# Доп. хосты результатов (кроме runninghub.ai/.cn): RH_IMG_HOSTS = "a.com,b.com"
ALLOWED_ORIGINS = "https://eyeanton.github.io,http://localhost:8000"
MAX_EMOTIONS = "6"
PER_IP_DAY = "2"
GLOBAL_DAY = "30"
RUNS_DAY = "400"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

# Секреты (не здесь!): npx wrangler secret put RUNNINGHUB_API_KEY | TURNSTILE_SECRET | IP_SALT
